# Local Postgres for development and tests only.
#
#   docker compose up -d
#
# Bound to 127.0.0.1, so nothing outside this machine can reach it, and trust auth, so there is
# no password to keep or leak. A deployed database is reached with an address and password kept in
# Key Vault instead (docs/DEPLOY.md).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ledger_desk
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
