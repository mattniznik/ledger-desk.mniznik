[project]
name = "ledger-desk"
version = "0.1.0"
description = "The accounts-payable desk of a fictional coffee roastery: invoices read by AI, checked by code, approved by a person, every step in a tamper-evident audit log."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pyyaml>=6",
  "reportlab>=4",
  "pillow>=10",
  "psycopg[binary]>=3.2",
  "fastapi>=0.162.7",
  "httpx>=0.28.1",
  "uvicorn>=0.54.0",
  "cryptography>=50.0.2",
  "langgraph>=1.2.22",
  "langgraph-checkpoint-postgres>=3.2.1",
  "pypdf>=7.1.0",
  "anthropic>=2.8.0",
]

[project.scripts]
ledger-desk = "ledger_desk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
