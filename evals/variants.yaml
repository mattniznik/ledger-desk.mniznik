# The 37 eval variants: the 13 sample invoices plus these make the 50-case
# eval set. Each variant starts from a sample (`base`) and changes only what it lists; line
# amounts, subtotal and total are recomputed so the document still adds up, unless
# `printed_total` is given on purpose. `expected` is written by hand from the policy (the
# approval rules and the checks), never computed by the rules being graded; "same" means the base's answer.
#
# Policy used for the answers: price over the PO by more than 2% (exactly 2% is inside);
# a recurring bill more than 25% from its trailing 3-bill average (exactly 25% is inside; the
# utility's average is $1,080.00); $5,000.00 and over, a capital purchase or a bank change needs
# the controller; a bank change is controller only; instruction-like text is flagged.

# --- the same invoice in another layout (9) ---------------------------------------------------
- {id: v01, base: "01", layout: banded,  what: "the clean green coffee invoice in the banded layout", expected: same}
- {id: v02, base: "03", layout: classic, what: "the cup price variance in the classic layout", expected: same}
- {id: v03, base: "04", layout: banded,  what: "the totals that do not add up in the banded layout", expected: same}
- {id: v04, base: "06", layout: minimal, what: "the dairy over-billing in the minimal layout", expected: same}
- {id: v05, base: "08", layout: classic, what: "the bank change in the classic layout", expected: same}
- {id: v06, base: "09", layout: classic, what: "the normal utility bill in the classic layout", expected: same}
- {id: v07, base: "10", layout: banded,  what: "the unusual utility bill in the banded layout", expected: same}
- {id: v08, base: "12", layout: minimal, what: "the planted instruction in the minimal layout", expected: same}
- {id: v09, base: "13", layout: minimal, what: "the capital equipment invoice in the minimal layout", expected: same}

