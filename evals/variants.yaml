# --- the 2% price tolerance (7) ----------------------------------------------------------------
- id: v17
  base: "01"
  what: "green coffee at $316.20 against the PO's $310.00: exactly 2% over, just inside the tolerance"
  lines: [{unit_price: "316.20"}]
  expected: {status: ready, flags: [], approver: controller, account: "1200"}
- id: v18
  base: "01"
  what: "green coffee at $316.21 against $310.00: just outside the 2% tolerance, $6.21 x 20 bags"
  lines: [{unit_price: "316.21"}]
  expected: {status: exception, flags: [{code: PRICE_VARIANCE, amount: "124.20"}], approver: controller, account: "1200"}
- id: v19
  base: "03"
  what: "cups re-billed at the PO price of $0.38: the corrected invoice, no variance"
  lines: [{unit_price: "0.38"}]
  expected: {status: ready, flags: [], approver: clerk, account: "1210"}
- id: v20
  base: "03"
  what: "cups at $0.39 against $0.38: 2.6% over, just outside the tolerance"
  lines: [{unit_price: "0.39"}]
  expected: {status: exception, flags: [{code: PRICE_VARIANCE, amount: "50.00"}], approver: clerk, account: "1210"}
- id: v21
  base: "06"
  what: "milk billed for the 100 gallons received at the PO price: nothing wrong"
  lines: [{quantity: 100}]
  expected: {status: ready, flags: [], approver: clerk, account: "5100"}
- id: v22
  base: "06"
  what: "milk at $4.28 against $4.20: 1.9% over, just inside the tolerance"
  lines: [{quantity: 100, unit_price: "4.28"}]
  expected: {status: ready, flags: [], approver: clerk, account: "5100"}
- id: v23
  base: "06"
  what: "milk at $4.29 against $4.20: 2.1% over, just outside the tolerance"
  lines: [{quantity: 100, unit_price: "4.29"}]
  expected: {status: exception, flags: [{code: PRICE_VARIANCE, amount: "9.00"}], approver: clerk, account: "5100"}

# --- the recurring bill's 25% band around its $1,080.00 average (4) ------------------------------
- id: v24
  base: "09"
  what: "utility at $1,350.00: exactly 25% over the average, just inside the band"
  lines: [{unit_price: "1350.00"}]
  expected: {status: ready, flags: [], approver: clerk, account: "6200"}
- id: v25
  base: "09"
  what: "utility at $1,350.01: just outside the 25% band"
  lines: [{unit_price: "1350.01"}]
  expected: {status: exception, flags: [{code: UNUSUAL_AMOUNT, amount: "270.01"}], approver: clerk, account: "6200"}
- id: v26
  base: "09"
  what: "utility at $810.00: exactly 25% under the average, just inside the band"
  lines: [{unit_price: "810.00"}]
  expected: {status: ready, flags: [], approver: clerk, account: "6200"}
- id: v27
  base: "09"
  what: "utility at $809.99: just outside the band on the low side"
  lines: [{unit_price: "809.99"}]
  expected: {status: exception, flags: [{code: UNUSUAL_AMOUNT, amount: "-270.01"}], approver: clerk, account: "6200"}

