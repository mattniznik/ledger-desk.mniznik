name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Everything runs on recordings: the model is a scripted fake or a recorded real run replayed through today's
# code, QuickBooks a fake transport, the ERP an in-process app. No secrets, no model calls, no deploy.
# Postgres 17 runs as a service on the address the tests expect (127.0.0.1:55432, trust auth, as in
# docker-compose.yml).
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ledger_desk
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      # CI never pushes, so the token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-14
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, resolved 2026-11-14
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Tests (pytest, on recordings and the Postgres service)
        run: uv run pytest -p no:warnings

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-14
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-11-14
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types and build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npx vitest run

  # The page in headless Chromium at 1280 x 800 and 390 x 844 with reduced motion, against the real app API in
  # replay mode on its own seeded database (web/playwright.config.ts).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ledger_desk
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-14
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, resolved 2026-11-14
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-11-14
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          uv sync --locked --project ..
          npm ci

      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: npx playwright test

      - name: Keep the report when a test fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, resolved 2026-11-14
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
